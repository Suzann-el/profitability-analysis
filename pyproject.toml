[project]
name = "profit"
version = "0.1.0"
description = "Analyse de rentabilité et de marge (AdventureWorksDW) : SQL/DuckDB, pont prix-volume-mix, Pareto/ABC, remises, simulations"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
